<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الباقات — UNI PLUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--primary:#013878;--gold:#C9A227;--gold-light:#E8C766;--text:#013878;--muted:#4a5a6a;--danger:#dc2626;--success:#16a34a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cairo',sans-serif;background:#f0f4f8;color:var(--text);line-height:1.7;padding:20px}
  .container{max-width:1100px;margin:0 auto}
  .header{background:linear-gradient(135deg,var(--primary),#0a4a96);color:#fff;padding:24px;border-radius:16px;margin-bottom:24px;box-shadow:0 8px 32px rgba(1,56,120,.2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .header h1{font-size:1.3rem}
  .header p{font-size:.85rem;opacity:.85;margin-top:4px}
  .btn{padding:10px 20px;border-radius:50px;font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;border:none;transition:.3s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--primary);box-shadow:0 4px 14px rgba(201,162,39,.4)}
  .btn-gold:hover{transform:translateY(-2px)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#0a4a96);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:6px 14px;font-size:.78rem}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 24px rgba(1,56,120,.08);margin-bottom:20px}
  .card h2{font-size:1.1rem;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--gold)}
  .form-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group.full{grid-column:1/-1}
  .form-group label{font-size:.82rem;font-weight:700}
  .form-group input,.form-group textarea{width:100%;padding:11px 14px;border:1.5px solid #d0dae8;border-radius:10px;font-family:inherit;font-size:.9rem;outline:none;transition:.2s}
  .form-group input:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(1,56,120,.1)}
  .form-group textarea{resize:vertical;min-height:80px}
  .checkbox-row{display:flex;align-items:center;gap:8px}
  .checkbox-row input{width:auto}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .packages-list{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:768px){.packages-list{grid-template-columns:1fr 1fr}}
  .pkg-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:.2s}
  .pkg-item:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(201,162,39,.15)}
  .pkg-thumb{width:70px;height:70px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#0a4a96);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5)}
  .pkg-thumb img{width:100%;height:100%;object-fit:cover}
  .pkg-info{flex:1;min-width:0}
  .pkg-info h3{font-size:.95rem;margin-bottom:4px;word-break:break-word}
  .pkg-info p{font-size:.78rem;color:var(--muted);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pkg-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.72rem;margin-bottom:8px}
  .tag{padding:2px 8px;border-radius:50px;background:rgba(1,56,120,.08);color:var(--primary);font-weight:600}
  .tag.inactive{background:rgba(220,38,38,.1);color:var(--danger)}
  .tag.gold{background:rgba(201,162,39,.15);color:#a88520}
  .pkg-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--primary);color:#fff;padding:12px 24px;border-radius:50px;box-shadow:0 8px 32px rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:9999;font-weight:600}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.error{background:var(--danger)}
  .toast.success{background:var(--success)}
  .help{font-size:.75rem;color:var(--muted);margin-top:4px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:9998;overflow-y:auto}
  .modal.show{display:flex}
  .modal-content{background:#fff;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
  .modal-content h3{margin-bottom:16px}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>🎛️ لوحة تحكم الباقات والعروض</h1>
      <p>إدارة باقات UNI PLUS — التغييرات تظهر فوراً على الموقع</p>
    </div>
    <a href="index.html" class="btn btn-gold">← العودة للموقع</a>
  </div>

  <!-- Form -->
  <div class="card">
    <h2 id="formTitle">➕ إضافة باقة جديدة</h2>
    <form id="packageForm">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group">
          <label>العنوان *</label>
          <input type="text" id="title" required placeholder="مثال: باقة إسطنبول الصيفية">
        </div>
        <div class="form-group">
          <label>الوجهة</label>
          <input type="text" id="destination" placeholder="مثال: إسطنبول، تركيا">
        </div>
        <div class="form-group full">
          <label>الوصف</label>
          <textarea id="description" placeholder="وصف مختصر للباقة..."></textarea>
        </div>
        <div class="form-group">
          <label>السعر</label>
          <input type="number" id="price" step="0.01" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label>العملة</label>
          <input type="text" id="currency" value="LYD" placeholder="LYD">
        </div>
        <div class="form-group">
          <label>المدة</label>
          <input type="text" id="duration" placeholder="مثال: 7 ليالٍ / 8 أيام">
        </div>
        <div class="form-group">
          <label>الشارة (Badge)</label>
          <input type="text" id="badge" placeholder="مثال: الأكثر مبيعاً">
        </div>
        <div class="form-group full">
          <label>رابط الصورة</label>
          <input type="url" id="image_url" placeholder="https://example.com/image.jpg">
          <span class="help">ضع رابط صورة مباشر (Unsplash, imgur, إلخ) — اتركه فارغاً لصورة افتراضية</span>
        </div>
        <div class="form-group full">
          <label>المميزات (سطر لكل ميزة)</label>
          <textarea id="features" placeholder="تذاكر طيران&#10;فندق 4 نجوم&#10;استقبال بالمطار"></textarea>
        </div>
        <div class="form-group">
          <label>ترتيب العرض</label>
          <input type="number" id="sort_order" value="0" min="0">
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <div class="checkbox-row">
            <input type="checkbox" id="is_active" checked>
            <label for="is_active" style="font-weight:600;cursor:pointer">نشط (يظهر على الموقع)</label>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-gold" id="submitBtn">💾 حفظ الباقة</button>
        <button type="button" class="btn btn-primary" onclick="resetForm()">↺ إفراغ الحقول</button>
      </div>
    </form>
  </div>

  <!-- List -->
  <div class="card">
    <h2>📋 الباقات الحالية (<span id="count">0</span>)</h2>
    <div id="packagesList" class="packages-list">
      <div class="empty">جارٍ التحميل...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://mmqbwmnvcpblateekoed.supabase.co";
const SUPABASE_KEY = "sb_publishable_2kGdSLEcZLKBFjjolUo3Lg_4D-gR7fY";

const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast ' + type, 3000);
}

function escapeHtml(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function formatPrice(v){const n=Number(v);return isNaN(n)?v:n.toLocaleString('en-US',{maximumFractionDigits:2})}

async function loadList() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/packages?select=*&order=sort_order.asc,created_at.desc`, { headers: HEADERS });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('count').textContent = data.length;

    if (!data.length) {
      document.getElementById('packagesList').innerHTML = '<div class="empty" style="grid-column:1/-1">لا توجد باقات بعد. أضف أول باقة من النموذج أعلاه ✨</div>';
      return;
    }

    document.getElementById('packagesList').innerHTML = data.map(p => `
      <div class="pkg-item">
        <div class="pkg-thumb">${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="" onerror="this.style.display='none'">` : '📦'}</div>
        <div class="pkg-info">
          <h3>${escapeHtml(p.title)}</h3>
          ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ''}
          <div class="pkg-meta">
            ${p.destination ? `<span class="tag">📍 ${escapeHtml(p.destination)}</span>` : ''}
            ${p.price ? `<span class="tag gold">💰 ${formatPrice(p.price)} ${escapeHtml(p.currency||'')}</span>` : ''}
            ${p.duration ? `<span class="tag">⏱ ${escapeHtml(p.duration)}</span>` : ''}
            ${!p.is_active ? '<span class="tag inactive">🔴 غير نشط</span>' : ''}
          </div>
          <div class="pkg-actions">
            <button class="btn btn-primary btn-sm" onclick='editPkg(${JSON.stringify(p).replace(/'/g, "&apos;")})'>✏️ تعديل</button>
            <button class="btn btn-danger btn-sm" onclick="deletePkg(${p.id})">🗑️ حذف</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('packagesList').innerHTML = '<div class="empty" style="grid-column:1/-1">❌ تعذّر تحميل الباقات</div>';
  }
}

function getFormData() {
  const featuresText = document.getElementById('features').value.trim();
  const features = featuresText ? featuresText.split('\n').map(l => l.trim()).filter(Boolean) : [];
  return {
    title: document.getElementById('title').value.trim(),
    description: document.getElementById('description').value.trim() || null,
    price: document.getElementById('price').value ? Number(document.getElementById('price').value) : null,
    currency: document.getElementById('currency').value.trim() || 'LYD',
    image_url: document.getElementById('image_url').value.trim() || null,
    destination: document.getElementById('destination').value.trim() || null,
    duration: document.getElementById('duration').value.trim() || null,
    features: features,
    badge: document.getElementById('badge').value.trim() || null,
    is_active: document.getElementById('is_active').checked,
    sort_order: Number(document.getElementById('sort_order').value) || 0
  };
}

document.getElementById('packageForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const payload = getFormData();
  if (!payload.title) return toast('العنوان مطلوب', 'error');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';

  try {
    let res;
    if (editId) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/packages?id=eq.${editId}`, {
        method: 'PATCH', headers: HEADERS, body: JSON.stringify(payload)
      });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/packages`, {
        method: 'POST', headers: HEADERS, body: JSON.stringify(payload)
      });
    }
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    toast(editId ? '✅ تم تحديث الباقة' : '✅ تمت إضافة الباقة');
    resetForm();
    loadList();
  } catch (err) {
    console.error(err);
    toast('❌ فشل الحفظ: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 حفظ الباقة';
  }
});

function editPkg(p) {
  document.getElementById('editId').value = p.id;
  document.getElementById('title').value = p.title || '';
  document.getElementById('description').value = p.description || '';
  document.getElementById('price').value = p.price || '';
  document.getElementById('currency').value = p.currency || 'LYD';
  document.getElementById('image_url').value = p.image_url || '';
  document.getElementById('destination').value = p.destination || '';
  document.getElementById('duration').value = p.duration || '';
  document.getElementById('badge').value = p.badge || '';
  document.getElementById('features').value = Array.isArray(p.features) ? p.features.join('\n') : '';
  document.getElementById('is_active').checked = p.is_active !== false;
  document.getElementById('sort_order').value = p.sort_order || 0;
  document.getElementById('formTitle').textContent = '✏️ تعديل الباقة';
  document.getElementById('submitBtn').textContent = '💾 تحديث الباقة';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deletePkg(id) {
  if (!confirm('هل تريد حذف هذه الباقة؟')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/packages?id=eq.${id}`, {
      method: 'DELETE', headers: HEADERS
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    toast('✅ تم الحذف');
    loadList();
  } catch (e) {
    toast('❌ فشل الحذف', 'error');
  }
}

function resetForm() {
  document.getElementById('packageForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = '➕ إضافة باقة جديدة';
  document.getElementById('submitBtn').textContent = '💾 حفظ الباقة';
  document.getElementById('is_active').checked = true;
  document.getElementById('currency').value = 'LYD';
  document.getElementById('sort_order').value = 0;
}

loadList();
</script>
</body>
</html>
